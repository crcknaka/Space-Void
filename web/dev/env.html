<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>env3d harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #9cf; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; left: 0; top: 0; right: 0; max-height: 70%; overflow: hidden; background: rgba(120,0,0,.92); color: #fff; white-space: pre-wrap; padding: 6px; display: none; z-index: 9; font-size: 11px; }
  #info { position: fixed; left: 8px; bottom: 6px; opacity: .75; text-shadow: 0 0 3px #000; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="err"></div><div id="info"></div>
<script>
  // visible error overlay: headless screenshots have no console
  const errBox = document.getElementById('err');
  function showErr(m) { errBox.style.display = 'block'; errBox.textContent += String(m).slice(0, 1800) + '\n'; }
  window.addEventListener('error', (e) => showErr(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', (e) => showErr('REJECT ' + (e.reason && (e.reason.stack || e.reason))));
  const cerr = console.error; console.error = (...a) => { showErr(a.join(' ')); cerr(...a); };
  const cwarn = console.warn; console.warn = (...a) => { if (/shader|WebGL|THREE/i.test(a.join(' '))) showErr('WARN ' + a.join(' ')); cwarn(...a); };
</script>
<script type="module">
// URL knobs: cam=top|tilt|chase  level=N  t=ms  warp=1..28  ion=0..1  eclipse=0..1  q=0.5|1
//            xf=1 (setSector(level+1) 750 ms before t → mid-crossfade)   bolt=1 (lightning 50 ms before t)
//            comet=1  bare=1 (no stand-ins)  nolights=1  stats=1 (measure luminance)  live=1 (keep animating)
//            px=playerX pz=playerZ  slow=1 (speedMul .5)  paused=1
//            event=<name>&et=<ms into the event> (deterministic; names: env.eventNames)  eplanet=0|1|2  auto=1 (scheduler on)  intense=1
//            planet=<gas|hotjup|rock|ice|lava|ocean|desert|shatter>  special=twin|shatter|hotjup  rings=1|0
//            cam=menu (the menu backdrop shot)  theme=<index into SECTOR_THEMES>  fd=<fieldDim, the game uses 0.32>  pres=<planetRes>
//            view=beauty (close-up of slot `slot`=0)  ph=<deg sun-planet-camera angle: 40 day, 95 terminator, 150 night>  dist=<radii>  el=<deg>
//            view=ship&model=<0 freighter|1 frigate|2 dreadnought|3 station|6 raider>&yaw=<deg>&pitch=<deg>&tint=0|1&sdist=<lengths>  (far-hull kit close-up)
//            view=sun (zoom on the sun; combine with event=flare&et=7000)  zoom=<fov deg>
//            station=1|0 (force the sector's orbital station)  nodepth=1 (shipDepth:false)  noprewarm=1 + frames=N (first-impression test: N live frames, no prewarm)
//            lost=1 (simulate WebGL context loss + restore before the shot)  fireball=1 (with event=meteors)
//            baketime=1 (time the planet bakes)  nomsaa=1  bloom=<strength>
//            view=cockpit|chase|tilt|top (same as cam=)  set=<wreck|yard|belt|ice|nebula|ring|solar>[,<second>] | set=none (default: by theme + level)
//            launch=<q 0..1> (carrier launch, frozen at q)  speed=<speedMul>  sx=<set track offset, units>  fw= fh= (field size)
import * as THREE from 'three';
import { EffectComposer } from '../vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../vendor/three-addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../vendor/three-addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../vendor/three-addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from '../vendor/three-addons/environments/RoomEnvironment.js';
import { Env3D } from '../js/env3d.js';
import { SECTOR_THEMES } from '../js/bggen.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
const camMode = Q.get('cam') || (['cockpit', 'chase', 'tilt', 'top'].includes(Q.get('view')) ? Q.get('view') : 'chase');
const level = num('level', 1) | 0;
const T = num('t', 20000);
const quality = num('q', 1);
const W = num('fw', 1400), H = num('fh', 790), FOV = 50, CHASE_FOV = 40, COCKPIT_FOV = 62, EYE_Y = 96, EYE_PITCH = 0.2;

const gl = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
const pr = num('pr', Math.min(window.devicePixelRatio || 1, 2));
gl.setPixelRatio(pr);
gl.setSize(innerWidth, innerHeight);
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 1.0;
document.body.appendChild(gl.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 5, 30000);
const pmrem = new THREE.PMREMGenerator(gl);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();
const sun = new THREE.DirectionalLight(0xfff0dc, 2.7);
const hemi = new THREE.HemisphereLight(0x8fb8ff, 0x1a1420, 0.9);
scene.add(sun, hemi);

// same target as the game: half-float + 4× MSAA (MSAA extrapolates varyings past primitive edges — a NaN there is smeared over the frame by the bloom)
const composer = new EffectComposer(gl, new THREE.WebGLRenderTarget(256, 256, { type: THREE.HalfFloatType, samples: Q.has('nomsaa') ? 0 : 4 }));
composer.setPixelRatio(pr);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), num('bloom', 0.5), 0.8, 0.9)); // same as the game (view3d.js)
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight);

const theme = (l) => SECTOR_THEMES[Q.has('theme') ? num('theme', 0) | 0 : (l - 1) % SECTOR_THEMES.length];
const beauty = Q.get('view') === 'beauty', shipView = Q.get('view') === 'ship', sunView = Q.get('view') === 'sun';
const pt = Q.get('planet');
const env = new Env3D(THREE, scene, {
  quality, level, theme: theme(level), renderer: gl, autoEvents: Q.has('auto'), fieldDim: num('fd', 0.4),
  planetTypes: pt ? [pt, pt, pt] : null, special: Q.get('special'), specialSlot: num('slot', beauty ? 0 : 1),
  rings: Q.has('rings') ? Q.get('rings') !== '0' : undefined, planetRes: num('pres', 1),
  station: Q.has('station') ? Q.get('station') !== '0' : undefined, shipDepth: !Q.has('nodepth'),
  sets: Q.has('set') ? (Q.get('set') === 'none' ? [] : Q.get('set').split(',')) : null,
});
let bakeMs = '';
if (Q.has('baketime')) { // how long do the bakes take? (GPU time, flushed with readPixels): first planet alone, then the rest
  const g = gl.getContext(), pxb = new Uint8Array(4), flush = () => { for (const sf of env.surfaces) if (sf.ready) { gl.readRenderTargetPixels(sf.A, 0, 0, 1, 1, pxb, 5); gl.readRenderTargetPixels(sf.B, 0, 0, 1, 1, pxb, 5); } gl.setRenderTarget(null); g.finish(); };
  gl.compile(scene, cam); flush();
  let t0 = performance.now(); env._bakeStep(Infinity, 1); flush(); const a = performance.now() - t0;
  t0 = performance.now(); env._bakeStep(300000); flush(); const c = performance.now() - t0;
  t0 = performance.now(); env.prewarm(gl); flush(); const b = performance.now() - t0;
  bakeMs = ` | bake: first surface ${a.toFixed(0)} ms, one 300k step ${c.toFixed(1)} ms, rest ${b.toFixed(0)} ms`;
}
if (!Q.has('noprewarm')) env.prewarm(gl);
if (Q.has('sx')) env._set.sf = ((num('sx', 0) % 12000) + 12000) % 12000;
if (shipView) { // one hull of the kit, close: [model, x, y, z, quaternion, scale, seed, tint]
  const e = new THREE.Euler(num('pitch', 0) * Math.PI / 180, num('yaw', 0) * Math.PI / 180, num('roll', 0) * Math.PI / 180, 'YXZ'), q = new THREE.Quaternion().setFromEuler(e);
  env.debugInst = [num('model', 2), 0, -4000, 0, q.x, q.y, q.z, q.w, 1000, 3.3, num('tint', 0)];
}
const evLog = [];
if (Q.has('auto')) { const ev0 = env.event.bind(env); env.event = (n, o) => { const ok = ev0(n, o); if (ok) evLog.push(`${n}@${(simT / 1000).toFixed(0)}`); return ok; }; }
window.env = env;

// ---- stand-in gameplay ----
const bare = Q.has('bare') || beauty || shipView || sunView;
const px = num('px', -380), pz = num('pz', 60);
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const ships = [], bullets = [], glows = [];
if (!bare) {
  const hull = new THREE.MeshStandardMaterial({ color: 0x8a9099, metalness: 0.55, roughness: 0.42 });
  const box = new THREE.BoxGeometry(1, 1, 1);
  const mk = (x, z, sx, sy, sz) => { const m = new THREE.Mesh(box, hull); m.position.set(x, 0, z); m.scale.set(sx, sy, sz); scene.add(m); ships.push(m); return m; };
  mk(px, pz, 60, 14, 44).visible = camMode !== 'cockpit';
  mk(260, -210, 60, 16, 46); mk(420, 120, 60, 16, 46); mk(120, 250, 50, 14, 40); mk(560, -60, 60, 16, 46);
  mk(40, -40, 180, 40, 140); // boss-ish
  const bolt = new THREE.SphereGeometry(1, 10, 8);
  const mkB = (col, n) => {
    const m = new THREE.InstancedMesh(bolt, new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), n);
    m.material.color.setRGB(col[0], col[1], col[2]); m.frustumCulled = false; scene.add(m); return m;
  };
  bullets.push({ m: mkB([3.2, 4.2, 5], 12), n: 12, player: true }, { m: mkB([5, 2.6, 1.4], 26), n: 26, player: false });
}
// dynamic lights (explosions, muzzle, engine) with matching glow sprites
const LIGHTS = new Float32Array(16 * 8);
const lightDefs = Q.has('nolights') ? [] : [
  { col: [5, 2.4, 0.8], r: 300, f: (t) => [180 + Math.sin(t / 2100) * 60, 0, -150 + Math.cos(t / 1700) * 40, 0.6 + 0.4 * Math.sin(t / 300)] },      // explosion
  { col: [4.5, 1.6, 0.5], r: 230, f: (t) => [470 + Math.sin(t / 1900) * 50, 0, 190, 0.75] },                                                       // fire
  { col: [0.6, 2.2, 4.5], r: 130, f: (t) => [px + 60, 0, pz, 0.8] },                                                                              // muzzle flash
  { col: [0.5, 1.6, 3.6], r: 90, f: (t) => [px + 200 + ((t / 4) % 500), 0, pz, 0.6] },                                                            // player bolt
  { col: [3.5, 0.5, 2.8], r: 190, f: (t) => [-60 + Math.sin(t / 1300) * 120, 0, 270, 0.7] },                                                       // plasma
  { col: [1, 3.5, 1.2], r: 150, f: (t) => [620, 0, -300 + Math.sin(t / 900) * 30, 0.55] },                                                        // pickup
];
for (const d of lightDefs) {
  if (bare || Q.has('noglow')) break;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.material.color.setRGB(d.col[0] * 0.3, d.col[1] * 0.3, d.col[2] * 0.3);
  scene.add(s); glows.push(s);
}
const dummy = new THREE.Object3D();
function standIns(t) {
  let n = 0;
  for (const d of lightDefs) {
    const p = d.f(t), o = n * 8;
    LIGHTS[o] = p[0]; LIGHTS[o + 1] = p[1]; LIGHTS[o + 2] = p[2];
    LIGHTS[o + 3] = d.col[0]; LIGHTS[o + 4] = d.col[1]; LIGHTS[o + 5] = d.col[2];
    LIGHTS[o + 6] = d.r; LIGHTS[o + 7] = p[3];
    if (glows[n]) { glows[n].position.set(p[0], 4, p[2]); glows[n].scale.setScalar(d.r * 0.5 * p[3]); }
    n++;
  }
  for (const b of bullets) {
    for (let i = 0; i < b.n; i++) {
      const h = Math.sin(i * 127.1) * 43758.5453, r = h - Math.floor(h);
      const h2 = Math.sin(i * 311.7) * 43758.5453, r2 = h2 - Math.floor(h2);
      let x, z;
      if (b.player) { x = px + ((r * 1300 + t * 0.9) % 1100); z = pz + (i % 3 - 1) * 14; dummy.scale.set(13, 2.6, 2.6); }
      else { x = 700 - ((r * 1400 + t * 0.35) % 1400); z = (r2 - 0.5) * H * 0.9; dummy.scale.set(4.5, 4.5, 4.5); }
      dummy.position.set(x, 0, z); dummy.updateMatrix(); b.m.setMatrixAt(i, dummy.matrix);
    }
    b.m.instanceMatrix.needsUpdate = true;
  }
  return n;
}

const bv = new THREE.Vector3(), bv2 = new THREE.Vector3();
function placeCam() {
  if (beauty) { // orbit the chosen planet at a given phase angle
    const p = env.planets[num('slot', 0) | 0], ph = num('ph', 55) * Math.PI / 180, el = num('el', 18) * Math.PI / 180;
    const L = p.sun; bv.set(-L.z, 0, L.x).normalize(); bv2.crossVectors(L, bv);
    cam.position.copy(L).multiplyScalar(Math.cos(ph)).addScaledVector(bv, Math.sin(ph)).multiplyScalar(Math.cos(el)).addScaledVector(bv2, Math.sin(el))
      .multiplyScalar(p.R * num('dist', 3.3)).add(p.pos);
    cam.up.set(0, 1, 0); cam.lookAt(p.pos); cam.fov = num('fov', 40); cam.aspect = innerWidth / innerHeight; cam.near = 5; cam.far = 60000; cam.updateProjectionMatrix();
    return;
  }
  if (shipView) { // looking down at 35° from the side, like TILT sees them (the camera stays above y = 0 but off the field)
    const d = 1000 * num('sdist', 1.9), el = num('cel', 35) * Math.PI / 180;
    cam.position.set(0, -4000 + Math.sin(el) * d, Math.cos(el) * d); cam.up.set(0, 1, 0); cam.lookAt(0, -4000, 0);
    cam.fov = 40; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    return;
  }
  if (sunView) {
    cam.position.set(px - 540, 330, pz * 0.84); cam.up.set(0, 1, 0); cam.lookAt(bv.copy(env.sunSkyDirection).multiplyScalar(1000).add(cam.position));
    cam.fov = num('zoom', 9); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    return;
  }
  const hTop = (H / 2) / Math.tan((FOV * Math.PI) / 360);
  if (camMode === 'top') { cam.position.set(0, hTop, 0.01); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0); cam.fov = FOV; }
  else if (camMode === 'tilt') { cam.position.set(-W * 0.04, hTop * 0.74, hTop * 0.74); cam.up.set(0, 1, 0); cam.lookAt(0, 0, H * 0.07); cam.fov = FOV; }
  else if (camMode === 'cockpit') { cam.position.set(px + 10, EYE_Y, pz); cam.up.set(0, 1, 0); cam.lookAt(px + 10 + Math.cos(EYE_PITCH) * 600, EYE_Y - Math.sin(EYE_PITCH) * 600, pz); cam.fov = COCKPIT_FOV; }
  else if (camMode === 'menu') { cam.position.set(-560, 300, 0); cam.up.set(0, 1, 0); cam.lookAt(460, -10, 0); cam.fov = 42; }
  else { cam.position.set(px - 540, 330, pz * 0.84); cam.up.set(0, 1, 0); cam.lookAt(px + 470, 0, pz * 0.84 * 0.92); cam.fov = CHASE_FOV; }
  const warp = Math.min(1, (num('warp', 1) - 1) / 27);
  cam.fov += warp * 16;
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}

const state = {
  time: 0, W, H, mode: camMode, speedMul: Q.has('slow') ? 0.5 : num('speed', 1), warpMul: num('warp', 1), paused: false,
  ion: num('ion', 0), eclipse: num('eclipse', 0), lights: LIGHTS, lightCount: 0, playerX: px, playerZ: pz,
  viewH: innerHeight * pr, intense: Q.has('intense'),
};
let simT = 0, xfDone = false, boltDone = false, cometDone = false, evDone = false, evOk = null;
function step(dt) {
  simT += dt;
  state.time = simT;
  state.lightCount = standIns(simT);
  if (Q.has('xf') && !xfDone && simT >= T - 750) { xfDone = true; env.setSector(level + 1, theme(level + 1)); }
  if (Q.has('bolt') && !boltDone && simT >= T - 50) { boltDone = true; env.lightning(num('bx', 150), num('bz', 40)); }
  if (Q.has('comet') && !cometDone && simT >= T - num('comet', 1) * 4000) { cometDone = true; env.comet(); }
  placeCam();
  if (Q.has('event') && !evDone && simT >= T - num('et', 3000)) {
    evDone = true; env.update(0, cam, state);
    evOk = env.event(Q.get('event'), { planet: Q.has('eplanet') ? num('eplanet', 0) | 0 : undefined, force: true, fireball: Q.has('fireball'), count: Q.has('count') ? num('count', 1) : undefined });
  }
  if (Q.has('launch')) env.launch(num('launch', 0), px, pz);
  state.runT = simT;
  env.update(dt, cam, state);
  sun.position.copy(env.sunDirection); sun.color.copy(env.sunColor);
  hemi.color.copy(env.ambientColor);
}
function render() { composer.render(); }

// deterministic: simulate the last few seconds before T in fixed steps, then draw
simT = Math.max(0, T - num('pre', 60000));
// warp only ramps in during the last 1.2 s so the easing is exercised
if (!Q.has('noprewarm')) while (simT < T - 1e-6) step(16.6667);
else for (let i = 0, n = num('frames', 1); i < n; i++) { step(i ? 16.6667 : 0); if (i < n - 1) render(); }   // first-impression test: what do the first N real frames show?
if (Q.has('paused')) { state.paused = true; step(0); }
render(); gl.info.autoReset = false; gl.info.reset(); render(); const calls = gl.info.render.calls, tris = gl.info.render.triangles; gl.info.autoReset = true;

const info = document.getElementById('info');
// what the set pieces / carrier / hyperspace filaments cost in this frame: [draw calls, triangles]
function setStat() {
  const S = env._set; let d = 0, t = 0;
  for (const m of S.meshes) if (m.mesh.visible) { d++; t += m.tris * m.n; }
  if (S.spr.mesh.visible) { d++; t += S.spr.n * 2; }
  if (S.floor.visible) { d++; t += 2; }
  if (S.mote.mesh.visible) { d++; t += S.mote.mesh.geometry.instanceCount * 2; }
  if (S.fil.mesh.visible) { d++; t += S.fil.mesh.geometry.instanceCount * 2; }
  if (env._car.mesh.visible) { d++; t += env._car.m.tris; }
  return [d, t];
}
info.textContent = `cam=${camMode} level=${level} (${theme(level).name}) star=${env.sector.star}${env.sector.binary ? '+binary' : ''} planets=${env.sector.planets}${env.sector.twin >= 0 ? ' twin@' + env.sector.twin : ''} t=${T} q=${quality}`
  + ` sets=${(env.sector.sets || []).join('+') || 'none'} calls=${calls} tris=${tris} | set draws=${setStat()[0]} tris=${setStat()[1]}`
  + (Q.has('event') ? ` event=${Q.get('event')}:${evOk}` : '') + (env.ready ? '' : ' NOT-READY')
  + (evLog.length ? ' | events: ' + evLog.join(' ') : '') + bakeMs
  + (env._stn && env._stn.on ? ` | station@slot${env._stn.p.slot} a=${(env._stn.a % 6.283).toFixed(2)} ndc=${env._stn.pos.clone().project(cam).toArray().map((v) => v.toFixed(2))} S=${env._stn.S | 0}` : '');
if (Q.has('stats')) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(gl.domElement, 0, 0, 320, 180);
  const d = g.getImageData(0, 0, 320, 180).data;
  const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const region = (x0, y0, x1, y1) => {
    let s = 0, mx = 0, n = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const o = (y * 320 + x) * 4; const l = 0.2126 * lin(d[o]) + 0.7152 * lin(d[o + 1]) + 0.0722 * lin(d[o + 2]);
      s += l; if (l > mx) mx = l; n++;
    }
    return `${(s / n).toFixed(3)} (max ${mx.toFixed(2)})`;
  };
  const ri = gl.info.render, mem = gl.info.memory;
  info.textContent += ` | display-linear luminance: all ${region(0, 0, 320, 180)} centre ${region(60, 40, 260, 140)} top15% ${region(0, 0, 320, 27)}`
    + ` | programs ${gl.info.programs.length} geos ${mem.geometries} tex ${mem.textures} envObjs ${env.group.children.filter((o) => o.visible).length} calls ${calls}`;
}
if (Q.has('noenv')) env.group.visible = false;
if (Q.has('lost')) { // lose the WebGL context and get it back: the baked planets must return on their own
  const ext = gl.getContext().getExtension('WEBGL_lose_context');
  gl.domElement.addEventListener('webglcontextrestored', () => { info.textContent += ' | context restored, re-baking'; });
  setTimeout(() => { ext.loseContext(); setTimeout(() => ext.restoreContext(), 120); }, 100);
  // headless Chrome stops presenting the canvas after a loss: copy the frame into an <img> so the screenshot shows it
  setTimeout(() => { render(); const im = new Image(); im.src = gl.domElement.toDataURL(); im.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh'; document.body.insertBefore(im, info); }, 3500);
  setInterval(() => { info.textContent = info.textContent.replace(/ \| bake.*$/, '') + ` | bake ${env.bakeProgress.toFixed(2)} ready=${env.ready} lost=${env._ctxLost} glLost=${gl.getContext().isContextLost()} ops=${env.planets.map((p) => p.op.toFixed(2))}`; }, 300);
}
if (Q.has('bench')) { // ?bench=N: N composer frames, flushed with readPixels; compare with &noenv=1
  const g = gl.getContext(), pxb = new Uint8Array(4), N = num('bench', 60);
  const run = () => { const t0 = performance.now(); for (let i = 0; i < N; i++) composer.render(); g.readPixels(0, 0, 1, 1, g.RGBA, g.UNSIGNED_BYTE, pxb); return (performance.now() - t0) / N; };
  run(); const a = run(), b = run();
  info.style.fontSize = '22px';
  info.textContent += ` | bench ${Math.min(a, b).toFixed(2)} ms/frame @${gl.domElement.width}x${gl.domElement.height}`;
}
if (Q.has('live')) {
  let last = performance.now(), acc = 0, frames = 0;
  const loop = (now) => {
    const dt = Math.min(50, now - last); last = now;
    step(dt); render();
    acc += dt; frames++;
    if (acc > 1000) { info.textContent = info.textContent.replace(/ fps.*$/, '') + ` fps ${(frames * 1000 / acc).toFixed(0)}`; acc = 0; frames = 0; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
else if (Q.has('lost')) setInterval(() => { step(16.6667); render(); }, 16);   // timer-driven: headless Chrome stops delivering rAF after a context loss
else { const again = () => { render(); requestAnimationFrame(again); }; requestAnimationFrame(again); } // headless screenshots need presented frames
addEventListener('resize', () => { gl.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); state.viewH = innerHeight * pr; });
</script>
</body>
