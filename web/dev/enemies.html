<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACE VOID — enemies3d viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #04060b; color: #9fb4cc; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #out { display: block; }
  #err { position: fixed; left: 0; top: 0; right: 0; margin: 0; color: #ff8080; background: rgba(50, 0, 0, .88); white-space: pre-wrap; z-index: 9; padding: 0 8px; max-height: 70vh; overflow: hidden; font-size: 12px; }
  #hud { position: fixed; left: 8px; bottom: 6px; white-space: pre; text-shadow: 0 1px 2px #000; }
  #nav { position: fixed; right: 8px; bottom: 6px; text-align: right; }
  #nav a { color: #ff9a6f; margin-left: 8px; text-decoration: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body>
<pre id="err"></pre>
<canvas id="out"></canvas>
<div id="hud"></div>
<div id="nav"></div>
<script>
  // visible error overlay (headless screenshots have no console)
  const errBox = document.getElementById('err');
  const showErr = (m) => { errBox.textContent += String(m).slice(0, 1800) + '\n'; };
  window.addEventListener('error', (e) => showErr('ERROR: ' + (e.message || e) + (e.filename ? ` @ ${e.filename.split('/').pop()}:${e.lineno}:${e.colno}` : '')));
  window.addEventListener('unhandledrejection', (e) => showErr('REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>
<script type="module">
/*
  ?ship=basic|weaver|hunter|tank|sniper|carrier|shieldbearer|strafer|brood|drone
  &view=top|tilt|front|beauty|rear|under|side|chase|cockpit|tail     (close-up of one ship; default beauty)
        cockpit = nose-on from slightly above, the hull a third of the frame; tail = the same from behind
  knobs: &flash=0..1 &dim=0.4..1 &damage=0..1 &warp=0..1 &charge=0..1 &thrust=0..2 &opacity=0..1 &elite=1
         &aim=rad (turret / battery / rail traverse)  &roll=-1..1  &fire=0..1 (recoil pulse, 1 = the instant of the shot)
         &hits=1 (three hit marks, 1.5 s / 0.4 s / 0.03 s old)  &shadow=1 (sun shadow map)  &page=sec (age of broken-off parts)
         &death=0..1 (death fall)  &broken=N (parts broken off)  &parts=1 (show the broken-off pieces beside the hull)
  &dist=1 (camera distance multiplier)  &q=0.5 (low quality)  &t=ms (freeze animation time)  &bg=rrggbb
  ?sheet=1            contact sheet: every type, top + front 3/4 (+ &rows=top,front,tilt,rear  &ids=a,b)
  ?game=top|tilt|chase   a full game frame (world 1564x880) with all ten at in-game size beside a player ship
  ?states=1&ship=x    one type through every state knob (&view=tilt)
  ?dmg=1              damage contact sheet: each type at 0 / 0.35 / 0.7 / 1 (&ids=a,b,c  &view=tilt  &cols=0,0.35,0.7,1)
  ?mech=1&ship=x      one type through its machinery: aim, charge, roll, thrust, recoil, break-away parts, death fall
  ?game=...&mix=1     game frame with the fleet at mixed damage (0 / 0.35 / 0.7 / 1 and broken parts)
  ?timings=1          cold build timings in the HUD
*/
import * as THREE from 'three';
import { EffectComposer } from '../vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../vendor/three-addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../vendor/three-addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../vendor/three-addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from '../vendor/three-addons/environments/RoomEnvironment.js';
const { Enemies3D, ENEMY_IDS } = await import('../js/enemies3d.js?v=' + Date.now());
const { Ships3D } = await import('../js/ships3d.js');

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) && Q.get(k) !== '' && isFinite(+Q.get(k)) ? +Q.get(k) : d);
const P = {
  ship: Q.get('ship') || 'basic', view: Q.get('view') || 'beauty', thrust: num('thrust', 1),
  damage: num('damage', 0), flash: num('flash', 0), opacity: num('opacity', 1), dim: num('dim', 1), warp: num('warp', 0), charge: num('charge', 0),
  elite: !!num('elite', 0), dist: num('dist', 1), q: num('q', 1), t: Q.has('t') ? num('t', 0) : null,
  hits: num('hits', 0), page: num('page', 0.1),
  aim: num('aim', 0), roll: num('roll', 0), fire: num('fire', 0), death: num('death', 0), broken: num('broken', 0), parts: !!num('parts', 0),
};
// recommended in-game length (world units) per type — see the module report
const HIT = { basic: [50, 30], weaver: [50, 30], hunter: [50, 30], tank: [66, 40], sniper: [54, 24], carrier: [72, 44], shieldbearer: [52, 32], strafer: [62, 34], brood: [56, 34], drone: [34, 20] };
const LEN_K = { basic: 1.2, weaver: 1.2, hunter: 1.3, tank: 1.2, sniper: 1.5, carrier: 1.2, shieldbearer: 1.2, strafer: 1.2, brood: 1.2, drone: 1.2 };
const lenK = num('lenk', 1);
const GAME_LEN = Object.fromEntries(ENEMY_IDS.map((id) => [id, HIT[id][0] * LEN_K[id] * lenK]));
const WW = 1564, WH = 880, FOV = 50, CHASE_FOV = 40;

const out = document.getElementById('out'), ctx = out.getContext('2d');
const VW = window.innerWidth, VH = window.innerHeight;
out.width = VW; out.height = VH;

const glc = document.createElement('canvas');
const gl = new THREE.WebGLRenderer({ canvas: glc, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
gl.setPixelRatio(1);
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 1.0;
gl.debug.onShaderError = (g, prog, vs, fs) => {
  showErr('SHADER ERROR\n' + g.getProgramInfoLog(prog) + '\nVS: ' + g.getShaderInfoLog(vs) + '\nFS: ' + g.getShaderInfoLog(fs));
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(Q.get('bg') ? '#' + Q.get('bg') : 0x05070c);
const cam = new THREE.PerspectiveCamera(FOV, 16 / 9, 5, 30000);
{ // same lighting rig as view3d.js
  const pmrem = new THREE.PMREMGenerator(gl);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;
  pmrem.dispose();
  const sun = new THREE.DirectionalLight(0xfff0dc, 2.7);
  sun.position.set(-0.45, 1, 0.55);
  if (Q.get('shadow')) {
    gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFSoftShadowMap;
    sun.position.multiplyScalar(400); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;
    const c = sun.shadow.camera; c.left = c.bottom = -120; c.right = c.top = 120; c.near = 10; c.far = 1200; c.updateProjectionMatrix();
  }
  scene.add(sun, new THREE.HemisphereLight(0x8fb8ff, 0x1a1420, 0.9));
}
{ // star field
  const n = 1400, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let s = 7; const R = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < n; i++) {
    const u = R() * 2 - 1, a = R() * 6.283, r = Math.sqrt(1 - u * u), b = 0.15 + R() * R() * 1.4;
    pos.set([Math.cos(a) * r * 9000, u * 9000, Math.sin(a) * r * 9000], i * 3);
    col.set([b * (0.8 + R() * 0.3), b * 0.9, b * (0.9 + R() * 0.4)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true })));
}
const rt = new THREE.WebGLRenderTarget(256, 256, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(gl, rt);
composer.setPixelRatio(1);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, 0.8, 0.9)); // strength, radius, threshold as in view3d
composer.addPass(new OutputPass());

const fleet = new Enemies3D(THREE, { quality: P.q });
const heroes = new Ships3D(THREE, { quality: P.q });
const root = new THREE.Group();
scene.add(root);
const cache = new Map();
function inst(s, slot) {
  const key = s.id + '|' + (s.elite ? 'E' : '') + '|' + slot;
  let g = cache.get(key);
  if (!g) { g = s.player ? heroes.build(s.id) : fleet.build(s.id, { elite: !!s.elite }); cache.set(key, g); }
  return g;
}
let simT = P.t ?? 600;
// place ships: list of { id, x, z, len, rotY, elite, player, …state }
function stage(list) {
  root.clear();
  list.forEach((s, i) => {
    const g = inst(s, s.slot ?? i), u = g.userData;
    g.position.set(s.x || 0, s.y || 0, s.z || 0);
    g.scale.setScalar(s.len || 60);
    g.rotation.order = 'YXZ';
    g.rotation.set(s.roll || 0, s.rotY || 0, 0);
    u.setThrust(s.thrust ?? P.thrust); u.setFlash(s.flash ?? P.flash); u.setDamage(s.damage ?? P.damage); u.setOpacity(s.opacity ?? P.opacity);
    if (!s.player) {
      u.setDim(s.dim ?? P.dim); u.setWarp(s.warp ?? P.warp); u.setCharge(s.charge ?? P.charge);
      u.setAim(s.aim ?? P.aim, true); u.setRoll(s.ctl ?? P.roll); u.setDeath(s.death ?? P.death);
      for (let n = s.broken ?? P.broken; (u._broken || 0) < n; u._broken = (u._broken || 0) + 1) {
        const part = u.breakOff();
        if (!part) continue;
        if (s.parts ?? P.parts) { part.position.multiplyScalar(1.5).add(new THREE.Vector3(0, 0.12, 0)); part.rotation.set(0.5, 0.3, 0.4); g.add(part); (u._debris ||= []).push(part); }
        else part.userData.dispose();
      }
      u.settle();
      const fire = s.fire ?? P.fire;
      if (fire > 0) { u.setFire(); u.update(-110 * Math.log(Math.max(1e-3, fire)), simT - 16); } // decay the pulse to the asked level
      for (const d of u._debris || []) { if (!d._aged) { d._aged = 1; d.userData.update(P.page * 1000, simT); } else d.userData.update(0, simT); }
      if ((s.hits ?? P.hits) && !u._hits) {
        u._hits = 1;
        const H = [[0.12, 0.06, 1500, 0.6], [-0.16, -0.09, 400, 1], [-0.02, 0.1, num('fresh', 200), 0.8]];
        for (const [x, z, age, pw] of H) { u.update(0, simT - age); u.hit(x, 0, z, pw); }
      }
    }
    u.update(16, simT);
    root.add(g);
  });
}
const CLOSE = {
  top: { p: [0, 1, 0.0001], up: [0, 0, -1], d: 175 },
  tilt: { p: [-0.06, 0.74, 0.74], d: 170 },
  chase: { p: [1, 0.36, 0.0], d: 190 },
  beauty: { p: [0.74, 0.5, 0.66], d: 150 },
  front: { p: [1, 0.32, 0.42], d: 150 },
  head: { p: [1, 0.12, 0.0], d: 150 },
  rear: { p: [-0.8, 0.42, 0.52], d: 150 },
  under: { p: [0.5, -0.62, 0.6], d: 160 },
  side: { p: [0, 0.07, 1], d: 160 },
  cockpit: { p: [1, 0.2, 0.1], d: 118 },
  tail: { p: [-1, 0.3, 0.14], d: 118 },
};
function closeCam(view, aspect, dist = 1) {
  const c = CLOSE[view] || CLOSE.beauty, v = new THREE.Vector3(...c.p).normalize().multiplyScalar(c.d * dist * (aspect < 1.3 ? 1.25 : 1));
  cam.fov = 30; cam.aspect = aspect; cam.position.copy(v); cam.up.set(...(c.up || [0, 1, 0]));
  cam.lookAt(...(c.tgt || [0, 0, 0])); cam.updateProjectionMatrix();
}
function gameCam(mode, aspect, px = 0, pz = 0) {
  const hTop = (WH / 2) / Math.tan((FOV * Math.PI) / 360);
  cam.aspect = aspect; cam.fov = FOV; cam.up.set(0, 1, 0);
  if (mode === 'top') { cam.position.set(0, hTop, 0.01); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0); }
  else if (mode === 'chase') { cam.fov = CHASE_FOV; cam.position.set(px - 540, 330, pz * 0.84); cam.lookAt(px + 470, 0, pz * 0.84 * 0.92); }
  else { cam.position.set(-WW * 0.04, hTop * 0.74, hTop * 0.74); cam.lookAt(0, 0, WH * 0.07); }
  cam.updateProjectionMatrix();
}
function renderGL(w, h) {
  gl.setSize(w, h, false); composer.setSize(w, h);
  composer.render();
}
function label(str, x, y, col = '#8fa6c0') { ctx.fillStyle = col; ctx.font = '12px ui-monospace, Menlo, monospace'; ctx.fillText(str, x, y); }
function tile(x, y, w, h, text) {
  renderGL(w, h);
  ctx.drawImage(glc, 0, 0, w, h, x, y, w, h);
  if (text) label(text, x + 8, y + 16);
}
const hud = document.getElementById('hud');
const fmtInfo = (id) => { const i = fleet.info(id); return `${id}: ${i.tris} tris (hull ${i.trisBy.hull} emis ${i.trisBy.emis}), ${i.drawCalls} draws, ${i.rigParts} rig parts, breaks: ${i.parts.join(' ')}${i.aim ? ', aims' : ''}, first build ${(i.buildMs ?? 0).toFixed(1)} ms, size ${i.size.map((v) => v.toFixed(3)).join(' x ')} · frame: ${gl.info.render.calls} calls`; };

function drawSheet() {
  const rows = (Q.get('rows') || 'top,front').split(','), ids = Q.get('ids') ? Q.get('ids').split(',') : ENEMY_IDS;
  const half = Math.ceil(ids.length / 2), two = ids.length > 6;
  const cols = two ? half : ids.length, bands = two ? 2 : 1;
  const tw = Math.floor(VW / cols), th = Math.floor(VH / (rows.length * bands));
  ids.forEach((id, i) => rows.forEach((view, r) => {
    const c = i % cols, band = Math.floor(i / cols);
    stage([{ id, elite: P.elite }]);
    closeCam(view, tw / th, P.dist * (view === 'top' ? 0.8 : 0.72));
    tile(c * tw, (band * rows.length + r) * th, tw, th, r === 0 ? id : view);
  }));
}
function drawStates() {
  const id = P.ship, view = Q.get('view') || 'tilt';
  const S = [
    ['normal', {}], ['flash 0.25', { flash: 0.25 }], ['flash 1', { flash: 1 }], ['damage 0.5', { damage: 0.5 }], ['damage 1', { damage: 1 }],
    ['dim 0.45 + damage 1 (wreck)', { dim: 0.45, damage: 1 }], ['warp 0.8', { warp: 0.8 }], ['warp 0.5', { warp: 0.5 }], ['warp 0.2', { warp: 0.2 }], ['thrust 0', { thrust: 0 }],
    ['thrust 2', { thrust: 2 }], ['charge 0.35', { charge: 0.35 }], ['charge 0.7', { charge: 0.7 }], ['charge 1', { charge: 1 }], ['elite', { elite: true }],
  ];
  const cols = 5, rowsN = Math.ceil(S.length / cols), tw = Math.floor(VW / cols), th = Math.floor(VH / rowsN);
  S.forEach(([name, st], i) => {
    stage([{ id, slot: 's' + i, ...st }]);
    closeCam(view, tw / th, P.dist * 0.85);
    tile((i % cols) * tw, Math.floor(i / cols) * th, tw, th, `${id} · ${name}`);
  });
}
// each type through the four damage stages
function drawDamage() {
  const ids = Q.get('ids') ? Q.get('ids').split(',') : ENEMY_IDS.slice(0, 5), view = Q.get('view') || 'tilt';
  const cols = (Q.get('cols') || '0,0.35,0.7,1').split(',').map(Number);
  const tw = Math.floor(VW / cols.length), th = Math.floor(VH / ids.length);
  ids.forEach((id, r) => cols.forEach((d, c) => {
    stage([{ id, slot: 'd' + c, damage: d, elite: P.elite }]);
    closeCam(view, tw / th, P.dist * 0.8);
    tile(c * tw, r * th, tw, th, `${id} · damage ${d}`);
  }));
}
// one type through its moving parts
function drawMech() {
  const id = P.ship, view = Q.get('view') || 'beauty';
  const S = [
    ['rest', {}], ['aim +0.6', { aim: 0.6 }], ['aim -2 (clamped to the mount)', { aim: -2 }], ['charge 0.5', { charge: 0.5 }], ['charge 1', { charge: 1 }],
    ['roll +1', { ctl: 1 }], ['roll -1', { ctl: -1 }], ['thrust 0', { thrust: 0 }], ['thrust 2', { thrust: 2 }], ['fire (recoil)', { fire: 1 }],
    ['broken 1', { broken: 1, damage: 0.4 }], ['broken 2', { broken: 2, damage: 0.6 }], ['broken 3 + parts', { broken: 3, damage: 0.8, parts: true }], ['hits', { hits: 1 }], ['death 0.4', { death: 0.4, damage: 1, thrust: 0, dim: 0.45 }], ['death 0.95', { death: 0.95, damage: 1, thrust: 0, dim: 0.45 }],
  ];
  const cols = 5, rowsN = Math.ceil(S.length / cols), tw = Math.floor(VW / cols), th = Math.floor(VH / rowsN);
  S.forEach(([name, st], i) => {
    stage([{ id, slot: 'm' + i, elite: P.elite, ...st }]);
    closeCam(view, tw / th, P.dist * 0.85);
    tile((i % cols) * tw, Math.floor(i / cols) * th, tw, th, `${id} · ${name}`);
  });
}
// all ten at game size, facing -X, beside a player ship
function gameList(mode) {
  const ids = ENEMY_IDS, list = [];
  const px = -380;
  list.push({ id: 'vanguard', player: true, len: 60, x: mode === 'chase' ? px : -330, z: 0 });
  ids.forEach((id, i) => {
    let x, z;
    if (mode === 'chase') { x = px + 300 + (i % 5) * 190 + (i >= 5 ? 95 : 0); z = ((i * 3) % 10 - 4.5) * 62; }
    else { x = -150 + (i % 5) * 150; z = (i < 5 ? -1 : 1) * 95; }
    const m = Q.get('mix') ? { damage: [0, 0.35, 0.7, 1][(i + (i >= 5 ? 2 : 0)) % 4], broken: [0, 0, 1, 3][(i + (i >= 5 ? 2 : 0)) % 4] } : {};
    list.push({ id, len: GAME_LEN[id], x, z, rotY: Math.PI, elite: Q.get('elite') === 'mix' ? i % 3 === 0 : P.elite, ...m });
  });
  return list;
}
const enemyPrograms = () => { const c = gl.getContext(); return gl.info.programs.filter((p) => (c.getShaderSource(p.fragmentShader) || '').includes('uE3')).length; };
function drawGameFrame(mode) {
  const list = gameList(mode);
  stage(list);
  gameCam(mode, VW / VH, -380, 0);
  // &zoom=3&cx=0.6&cy=0.4: nearest-neighbour blow-up of the real frame pixels around (cx, cy)
  const zoom = num('zoom', 1), cx = num('cx', 0.5), cy = num('cy', 0.5);
  renderGL(VW, VH);
  const sw = VW / zoom, sh = VH / zoom, sx0 = Math.max(0, Math.min(VW - sw, cx * VW - sw / 2)), sy0 = Math.max(0, Math.min(VH - sh, cy * VH - sh / 2));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(glc, sx0, sy0, sw, sh, 0, 0, VW, VH);
  label(`game frame · ${mode} · world ${WW}x${WH} at ${VW}x${VH}${zoom > 1 ? ' · ' + zoom + 'x pixel zoom' : ''} · enemy shader programs: ${enemyPrograms()} (all programs ${gl.info.programs.length})`, 8, 16);
  const v = new THREE.Vector3();
  for (const s of list) {
    v.set(s.x, 0, s.z).project(cam);
    const px = ((v.x * 0.5 + 0.5) * VW - sx0) * zoom, py = ((-v.y * 0.5 + 0.5) * VH - sy0) * zoom;
    ctx.textAlign = 'center'; label(s.player ? 'player' : s.id + (s.damage != null ? ' ' + s.damage : ''), px, py + (mode === 'chase' ? 22 : 34) * zoom + 10, '#5f7288'); ctx.textAlign = 'left';
  }
}

function draw() {
  ctx.fillStyle = '#04060b'; ctx.fillRect(0, 0, VW, VH);
  if (Q.get('sheet')) drawSheet();
  else if (Q.get('states')) drawStates();
  else if (Q.get('dmg')) drawDamage();
  else if (Q.get('mech')) drawMech();
  else if (Q.get('game')) drawGameFrame(Q.get('game'));
  else { stage([{ id: P.ship, elite: P.elite }]); closeCam(P.view, VW / VH, P.dist); tile(0, 0, VW, VH); }
}

try {
  let lines = [];
  if (Q.get('timings')) { // cold build timings, one fresh factory
    const cold = new Enemies3D(THREE, { quality: P.q });
    for (const id of ENEMY_IDS) { const t0 = performance.now(); cold.build(id); const a = performance.now() - t0; const t1 = performance.now(); cold.build(id); lines.push(`${id.padEnd(13)} first ${a.toFixed(1).padStart(6)} ms  again ${(performance.now() - t1).toFixed(2)} ms  ${String(cold.info(id).tris).padStart(5)} tris`); }
    cold.dispose();
  }
  draw();
  const single = !Q.get('sheet') && !Q.get('game') && !Q.get('states') && !Q.get('dmg') && !Q.get('mech');
  hud.textContent = Q.get('timings') ? lines.join('\n') : (single ? fmtInfo(P.ship) : '');
  if (P.t == null) {
    let last = performance.now(), frames = 0;
    const loop = (now) => {
      simT += Math.min(50, now - last); last = now;
      if (single || frames++ % 6 === 0) draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  document.getElementById('nav').innerHTML = ENEMY_IDS.map((i) => `<a href="?ship=${i}&view=${P.view}">${i}</a>`).join('') + '<br>' +
    Object.keys(CLOSE).map((v) => `<a href="?ship=${P.ship}&view=${v}">${v}</a>`).join('') + '<br>' +
    `<a href="?sheet=1">sheet</a><a href="?game=top">game top</a><a href="?game=tilt">game tilt</a><a href="?game=chase">game chase</a><a href="?states=1&ship=${P.ship}">states</a><a href="?dmg=1">damage</a><a href="?dmg=1&ids=carrier,shieldbearer,strafer,brood,drone">damage 2</a><a href="?mech=1&ship=${P.ship}">mech</a><a href="?game=chase&mix=1">game mix</a><a href="?ship=${P.ship}&view=${P.view}&elite=1">elite</a>`;
} catch (e) { showErr('FATAL: ' + (e.stack || e)); }
</script>
</body>
</html>
