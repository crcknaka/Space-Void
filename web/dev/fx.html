<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; left: 0; top: 0; right: 0; max-height: 100%; overflow: hidden; color: #fff; background: rgba(160, 0, 0, .92);
    font: 12px/1.35 monospace; white-space: pre-wrap; padding: 8px; display: none; z-index: 10; }
  #info { position: fixed; left: 6px; bottom: 4px; right: 6px; color: #9ab; font: 11px/1.3 monospace; z-index: 5; text-shadow: 0 0 3px #000; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="err"></div><div id="info"></div>
<script>
  // fx3d dev harness. Deterministic: ?scene=explosions|bolts|beams|engines|lights|misc|all &t=<ms> &cam=top|tilt|chase
  //   (also scene=bossdeath|volley|impacts)
  //   &q=<quality> &zoom=<n>&cx=<x>&cz=<z> (close-up) &floor=1 &bloom=0 &bg=0 &live=1 (run in real time) &seed=<n>
  const errBox = document.getElementById('err');
  function showErr(m) { errBox.style.display = 'block'; errBox.textContent += m + '\n'; }
  window.onerror = (m, s, l, c, e) => showErr(`${m} @ ${s}:${l}:${c}\n${e && e.stack || ''}`);
  window.onunhandledrejection = (e) => showErr('REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  // deterministic Math.random (set before the modules load)
  {
    const q = new URLSearchParams(location.search);
    let a = (+q.get('seed') || 12345) >>> 0;
    Math.random = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from '../vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../vendor/three-addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../vendor/three-addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../vendor/three-addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from '../vendor/three-addons/environments/RoomEnvironment.js';
import { Fx3D, FX_PALETTE, FX_TUNING } from '../js/fx3d.js';

const Q = new URLSearchParams(location.search);
const SCENE = Q.get('scene') || 'all', TEND = +(Q.get('t') ?? 600), CAM = Q.get('cam') || 'tilt';
const W = 1400, H = 790, FOV = 50, CHASE_FOV = 40, DT = 16.67;
const vw = window.innerWidth, vh = window.innerHeight;

const gl = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
document.body.appendChild(gl.domElement);
gl.setPixelRatio(+Q.get('pr') || 1);
gl.setSize(vw, vh, false);
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 1.0;
gl.debug.onShaderError = (g, prog, vs, fs) => {
  showErr('SHADER ERROR\nprogram: ' + g.getProgramInfoLog(prog) + '\nVS: ' + g.getShaderInfoLog(vs) + '\nFS: ' + g.getShaderInfoLog(fs));
};

const scene = new THREE.Scene();
if (Q.get('bg') === '0') scene.background = new THREE.Color(0x000000);
else {
  // dim painted-sky stand-in so smoke silhouettes and dark rims are visible
  const c = document.createElement('canvas'); c.width = 512; c.height = 288;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 512, 288);
  gr.addColorStop(0, '#0a1230'); gr.addColorStop(0.5, '#1a1038'); gr.addColorStop(1, '#06202a');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 288);
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * 512, y = Math.random() * 288, r = 30 + Math.random() * 90;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    const hue = [200, 260, 300, 180][i & 3];
    rg.addColorStop(0, `hsla(${hue},70%,45%,0.16)`); rg.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.fillStyle = '#fff';
  for (let i = 0; i < 260; i++) { g.globalAlpha = Math.random() * 0.8; g.fillRect(Math.random() * 512, Math.random() * 288, 1, 1); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace;
  scene.background = tx; scene.backgroundIntensity = 0.42;
}
const pmrem = new THREE.PMREMGenerator(gl);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();
const sun = new THREE.DirectionalLight(0xfff0dc, 2.7);
sun.position.set(-0.45, 1, 0.55);
scene.add(sun, new THREE.HemisphereLight(0x8fb8ff, 0x1a1420, 0.9));

// ---- cameras ----
const cam = new THREE.PerspectiveCamera(FOV, vw / vh, 5, 30000);
const hTop = (H / 2) / Math.tan((FOV * Math.PI) / 360);
const zoom = +Q.get('zoom') || 1, cx = +Q.get('cx') || 0, cz = +Q.get('cz') || 0;
const PLAYER = { x: -420, z: 0 };
if (CAM === 'top') {
  cam.position.set(cx, hTop / zoom, cz + 0.01); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz);
} else if (CAM === 'chase') {
  cam.fov = CHASE_FOV / zoom;
  cam.position.set(PLAYER.x - 540, 330, PLAYER.z * 0.84);
  cam.lookAt(PLAYER.x + 470 + cx, 0, PLAYER.z * 0.84 * 0.92 + cz);
} else {
  cam.position.set(cx - W * 0.04 / zoom, hTop * 0.74 / zoom, cz + hTop * 0.74 / zoom);
  cam.lookAt(cx, 0, cz + H * 0.07 / zoom);
}
cam.updateProjectionMatrix(); cam.updateMatrixWorld();

const composer = new EffectComposer(gl);
composer.setPixelRatio(+Q.get('pr') || 1);
composer.setSize(vw, vh);
composer.addPass(new RenderPass(scene, cam));
if (Q.get('bloom') !== '0') composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.55, 0.42, 0.9));
composer.addPass(new OutputPass());

// ---- stand-in ships ----
const hull = new THREE.MeshStandardMaterial({ color: 0x8a8f98, metalness: 0.55, roughness: 0.42 });
const boxG = new THREE.BoxGeometry(60, 12, 36), sphG = new THREE.SphereGeometry(20, 24, 16), coneG = new THREE.ConeGeometry(16, 60, 12);
coneG.rotateZ(-Math.PI / 2);
function ship(x, z, kind = 0, s = 1) {
  const m = new THREE.Mesh(kind === 1 ? sphG : kind === 2 ? coneG : boxG, hull);
  m.position.set(x, 0, z); m.scale.setScalar(s); scene.add(m);
  return m;
}
if (Q.get('floor') === '1' || (SCENE === 'lights' && Q.get('floor') !== '0')) {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(4000, 3000), new THREE.MeshStandardMaterial({ color: 0x30343c, metalness: 0.1, roughness: 0.8 }));
  f.rotation.x = -Math.PI / 2; f.position.y = -14; scene.add(f);
}

const fx = new Fx3D(THREE, scene, { quality: +Q.get('q') || 1 });
window.fx = fx;

// ---- scripted scenes: events = [[timeMs, fn]] (negative time = relative to the end), each = per-frame fn(T) ----
const events = [], each = [];
const at = (ms, fn) => events.push([ms < 0 ? Math.max(0, TEND + ms) : ms, fn]);
const B = { player: { kind: 'player' }, hot: { kind: 'playerHot' }, plasma: { kind: 'playerPlasma' }, enemy: { kind: 'enemy' }, heavy: { kind: 'enemyHeavy' } };

function sExplosions() {
  ship(-470, -150); ship(-60, 150, 1); ship(120, -40); ship(300, -260, 2); ship(-250, 300);
  at(0, () => {
    fx.explosion(-380, 0, -150, 1);
    fx.explosion(20, 0, 40, 2.0);
    fx.explosion(-200, 0, 240, 0.6);
    fx.explosion(400, 0, -200, 1.2, { tint: [0.4, 0.8, 1.6], lightColor: [0.4, 0.7, 1] });
    fx.explosion(420, 0, 200, 1);
  });
}
function sBolts() {
  ship(PLAYER.x, PLAYER.z, 2); ship(420, -300); ship(430, 60, 1, 1.4);
  at(-220, () => fx.explosion(140, 0, 170, 1.3, { shockwave: false }));
  each.push((T) => {
    const k = T * 0.5;
    for (let i = 0; i < 12; i++) {
      const x = -600 + ((i * 100 + k) % 1200);
      fx.bolt(x, 0, -330, 1, 0, B.player);
      fx.bolt(x, 0, -270, 1, 0, B.hot);
      fx.bolt(x, 0, -205, 1, 0, B.plasma);
      fx.bolt(600 - ((i * 100 + k * 0.6) % 1200), 0, -130, -1, 0, B.enemy);
      fx.bolt(600 - ((i * 100 + k * 0.5) % 1200), 0, -65, -1, 0, B.heavy);
    }
    // the player's own stream + a diagonal spread
    for (let i = 0; i < 9; i++) {
      const d = 40 + ((i * 70 + k * 1.4) % 630);
      fx.bolt(PLAYER.x + d, 0, PLAYER.z - 8, 1, 0, B.player);
      fx.bolt(PLAYER.x + d, 0, PLAYER.z + 8, 1, 0, B.player);
      for (const a of [-0.35, 0.35]) fx.bolt(PLAYER.x + Math.cos(a) * d, 0, PLAYER.z + Math.sin(a) * d, Math.cos(a), Math.sin(a), i & 1 ? B.hot : B.plasma);
    }
    // enemy fan + ring, partly over fire
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + 0.2, d = 40 + ((k * 0.45 + i * 13) % 190);
      fx.bolt(140 + Math.cos(a) * d, 0, 170 + Math.sin(a) * d, Math.cos(a), Math.sin(a), i % 5 === 0 ? B.heavy : B.enemy);
    }
    for (let i = 0; i < 7; i++) for (let j = 0; j < 4; j++) {
      const a = Math.PI + (i - 3) * 0.16, d = 60 + ((k * 0.5 + j * 150) % 600);
      fx.bolt(430 + Math.cos(a) * d, 0, 60 + Math.sin(a) * d, Math.cos(a), Math.sin(a), B.enemy);
    }
    fx.fireTrail(140, 0, 170, { scale: 1.6 });
    fx.fireTrail(-60, 0, 110, { scale: 1.3 });
    fx.exhaust(PLAYER.x - 34, 0, PLAYER.z, -1, 0, 12, { color: 'player' });
  });
}
function sBeams() {
  ship(-560, -300, 2); ship(-560, -190, 0, 1.5); ship(-560, -90); ship(-560, -20); ship(-560, 50, 2);
  ship(200, -300, 1); ship(-100, -190, 1);
  each.push(() => {
    fx.beam(-520, -300, 660, -300, { kind: 'laser', width: 10, flare: 'origin' });
    fx.beam(-500, -190, 660, -190, { kind: 'boss', width: 34, flare: 'both' });
    fx.beam(-520, -90, 660, -90, { kind: 'telegraph', width: 6 });
    fx.beam(-520, -20, 660, -70, { kind: 'aim' });
    fx.beam(-520, 50, 660, 50, { kind: 'guide' });
    fx.beam(-300, 130, 100, 130, { kind: 'marker', width: 26 });
    fx.beam(200, 130, 600, 130, { kind: 'marker', width: 26, hot: true });
    fx.beam(-300, 210, -300, 330, { kind: 'marker', width: 40 });
    fx.beam(-180, 210, -180, 330, { kind: 'marker', width: 40, hot: true });
    // diagonal + short ones
    fx.beam(0, 200, 400, 340, { kind: 'laser', width: 6, flare: 'both' });
    fx.beam(480, 200, 620, 340, { kind: 'boss', width: 18, flare: 'impact' });
    fx.beam(-60, 220, -60, 340, { kind: 'telegraph', width: 12, color: [1, 0.6, 0.1] });
  });
}
function sEngines() {
  const S = [[-380, -250, 0], [-380, -150, 1], [-380, -40, 0.0], [-380, 60, 1]];
  ship(-340, -250, 2); ship(-340, -150, 2); ship(-340, -40, 2, 1.6); ship(-340, 60, 2, 1.6);
  ship(120, -250); ship(120, -150); ship(120, -40, 0, 1.6); ship(120, 60, 0, 1.6);
  ship(-340, 200, 2); ship(120, 200);
  each.push((T) => {
    fx.exhaust(-374, 0, -250, -1, 0, 12, { color: 'player' });
    fx.exhaust(-374, 0, -150, -1, 0, 12, { color: 'player', boost: true });
    fx.exhaust(-398, 0, -52, -1, 0, 14, { color: 'player' }); fx.exhaust(-398, 0, -28, -1, 0, 14, { color: 'player' });
    fx.exhaust(-398, 0, 48, -1, 0, 14, { color: 'player', boost: 1 }); fx.exhaust(-398, 0, 72, -1, 0, 14, { color: 'player', boost: 1 });
    fx.exhaust(152, 0, -250, 1, 0, 12, { color: 'enemy' });
    fx.exhaust(152, 0, -150, 1, 0, 12, { color: 'enemy', boost: true });
    fx.exhaust(170, 0, -52, 1, 0, 14, { color: 'enemy' }); fx.exhaust(170, 0, -28, 1, 0, 14, { color: 'enemy' });
    fx.exhaust(170, 0, 48, 1, 0, 14, { color: 'enemy', boost: 1 }); fx.exhaust(170, 0, 72, 1, 0, 14, { color: 'enemy', boost: 1 });
    fx.exhaust(-374, 0, 200, -1, 0, 12, { color: [0.4, 3, 0.9] });
    fx.exhaust(152, 0, 200, 0.7, 0.7, 12, { color: [3, 0.4, 2.6], boost: 0.5 });
    // rockets in flight
    const rx = -500 + (T * 0.42) % 1100;
    fx.rocketTrail(rx, 0, 300, -1, 0, { enemy: false });
    fx.rocketTrail(500 - (T * 0.3) % 1000, 0, -330, 1, 0.1, { color: 'player' });
    fx.fireTrail(420, 0, 120, { scale: 1.2 });
    fx.fireTrail(480 - (T * 0.12), -T * 0.02, 260, { vx: -120, vy: -20 });
  });
}
function sLights() {
  for (let i = -3; i <= 3; i++) for (let j = -2; j <= 2; j++) ship(i * 170, j * 140, (i + j + 10) % 3, 0.9);
  at(-200, () => fx.explosion(85, 0, 70, 1));
  at(-60, () => fx.muzzle(-420, 0, -70, 1, 0, { color: 'player' }));
  at(-30, () => fx.muzzle(260, 0, -210, -1, 0, { color: 'enemy', scale: 1.4 }));
  each.push((T) => {
    const a = T * 0.002;
    fx.lightNow(-340 + Math.cos(a) * 60, 30, 210 + Math.sin(a) * 60, [0.2, 1, 0.3], 0.25);
    fx.heatGlow(-340 + Math.cos(a) * 60, 30, 210 + Math.sin(a) * 60, 26, [0.5, 3, 0.8], 1);
    fx.lightNow(420, 30, 210, [1, 0.2, 1], 0.18, 260);
    fx.heatGlow(420, 30, 210, 26, [3, 0.5, 3], 1);
    for (let i = 0; i < 10; i++) fx.bolt(-560 + ((i * 115 + T * 0.5) % 1150), 0, -70, 1, 0, B.player);
    for (let i = 0; i < 8; i++) fx.bolt(560 - ((i * 140 + T * 0.4) % 1120), 0, 0, -1, 0, B.enemy);
    fx.beam(-560, -280, 600, -210, { kind: 'laser', width: 9 });
    fx.aura(-255, 0, 140, 46, [3, 2.2, 0.5], 1);
  });
}
function sMisc() {
  ship(-400, -220); ship(180, -220, 1, 2.2); ship(-430, 90, 2); ship(-230, 90, 1);
  at(-420, () => fx.warpIn(-500, 0, -60, 60));
  at(-300, () => fx.warpIn(-400, 0, -60, 60, { color: [5, 1, 0.4] }));
  at(-120, () => fx.warpIn(-300, 0, -60, 60));
  at(-360, () => fx.warpIn(-400, 0, -220, 60));
  at(-140, () => fx.pickup(-140, 0, -220, 'rgb(110,255,120)'));
  at(-320, () => fx.pickup(-40, 0, -220, 'rgb(255,180,60)'));
  at(-80, () => fx.shieldHit(180, 0, -220, -1, 0.3, 50));
  at(-200, () => fx.shieldHit(180, 0, -220, 0.2, 1, 50, [5, 2, 0.5]));
  at(-50, () => fx.lightningBolt(60, 10, 40, 520, 0, 250));
  at(-110, () => fx.lightningBolt(300, 40, -80, 560, 0, -300, { color: [5, 2, 6], width: 6 }));
  at(-30, () => fx.impact(380, 0, -40, -1, 0));
  at(-70, () => fx.sparks(480, 0, 0, 24, -1, 0, { spread: 0.6 }));
  at(-260, () => fx.shockwave(-80, 0, 250, 140, { color: [0.3, 0.45, 0.55] }));
  at(-120, () => fx.shockwave(140, 0, 300, 140, { color: [0.55, 0.3, 0.1], life: 500 }));
  at(-500, () => fx.dust(330, 0, 300, 90, { count: 12, chips: 5 }));
  at(-400, () => { for (let i = 0; i < 6; i++) fx.smokePuff(520 + i * 12, 0, 300 - i * 9, 60, { dark: 0.7, hot: i < 3 }); });
  each.push((T) => {
    fx.aura(-430, 0, 90, 52, [3, 2.2, 0.5], 1);
    fx.aura(-230, 0, 90, 34, [0.4, 2, 5], 0.8);
    fx.aura(-100, 0, 90, 20, [3, 0.4, 2.5], 1);
    fx.heatGlow(0, 0, 90, 20, [4, 0.3, 0.2], 1);
    fx.heatGlow(50, 0, 90, 40, [0.3, 2, 4], 1);
    fx.heatGlow(120, 0, 90, 80, [3, 1.5, 0.4], 0.6);
    fx.tracer(-500, 0, 330, -560, 0, 330, [2, 5, 8], [0.2, 0.6, 3], 5);
  });
}
function sAll() {
  ship(PLAYER.x, PLAYER.z, 2);
  const en = [[380, -240], [460, -60], [330, 130], [520, 260], [180, -120]];
  for (const e of en) ship(e[0], e[1], 0);
  at(-520, () => fx.explosion(240, 0, 40, 1.2));
  at(-180, () => fx.explosion(60, 0, -220, 1));
  at(-60, () => fx.explosion(360, 0, 250, 2.2));
  at(-300, () => fx.warpIn(560, 0, -330, 60));
  at(-90, () => fx.pickup(-250, 0, 160, 'rgb(0,210,255)'));
  at(-40, () => fx.lightningBolt(-100, 30, -360, 150, 0, -180));
  at(-50, () => fx.muzzle(PLAYER.x + 34, 0, PLAYER.z, 1, 0, { color: 'player' }));
  at(-70, () => fx.impact(350, 0, -236, -1, 0));
  each.push((T) => {
    const k = T * 0.5;
    fx.exhaust(PLAYER.x - 34, 0, PLAYER.z - 7, -1, 0, 11, { color: 'player', boost: 1 });
    fx.exhaust(PLAYER.x - 34, 0, PLAYER.z + 7, -1, 0, 11, { color: 'player', boost: 1 });
    fx.aura(PLAYER.x, 0, PLAYER.z, 52, [3, 2.2, 0.5], 1);
    for (const e of en) fx.exhaust(e[0] + 32, 0, e[1], 1, 0, 12, { color: 'enemy' });
    for (let i = 0; i < 10; i++) {
      const d = 40 + ((i * 75 + k * 1.4) % 750);
      fx.bolt(PLAYER.x + d, 0, PLAYER.z - 9, 1, 0, B.plasma);
      fx.bolt(PLAYER.x + d, 0, PLAYER.z + 9, 1, 0, B.plasma);
    }
    for (const e of en) for (let j = 0; j < 5; j++) {
      const a = Math.atan2(PLAYER.z - e[1], PLAYER.x - e[0]) + (j - 2) * 0.1, d = 50 + ((k * 0.5 + j * 37 + e[0]) % 620);
      fx.bolt(e[0] + Math.cos(a) * d, 0, e[1] + Math.sin(a) * d, Math.cos(a), Math.sin(a), B.enemy);
    }
    fx.beam(PLAYER.x + 30, PLAYER.z + 60, 700, PLAYER.z + 60, { kind: 'laser' });
    fx.beam(520, 260, -700, 330, { kind: 'telegraph', width: 8 });
    fx.beam(-200, -390, -200, 390, { kind: 'marker', width: 30, hot: true });
    fx.beam(40, -390, 40, 390, { kind: 'marker', width: 30 });
    fx.fireTrail(330, 0, 130);
    fx.rocketTrail(300 - (T * 0.3) % 600, 0, -330, 1, 0, {});
  });
}
// close-up of hits: armour impacts, the sim's 2-spark sprays, chips, arcs, beam impact flecks (use &zoom=3&cx=0&cz=0)
function sImpacts() {
  ship(-150, -60, 0, 1.4); ship(120, 70, 1, 1.4); ship(-120, 110, 2, 1.2);
  at(-45, () => fx.impact(-118, 0, -60, -1, 0));
  at(-110, () => fx.impact(-118, 0, -40, -1, 0.4, { color: 'player' }));
  at(-30, () => { for (let i = 0; i < 6; i++) { const a = Math.PI + (Math.random() - 0.5) * 1.8; fx.sparks(90, 0, 70, 2, Math.cos(a) * 4, Math.sin(a) * 4, { speed: 260, spread: 0.5 }); } });
  at(-160, () => { for (let i = 0; i < 6; i++) { const a = Math.PI + (Math.random() - 0.5) * 1.8; fx.sparks(96, 0, 50, 2, Math.cos(a) * 4, Math.sin(a) * 4, { speed: 260, spread: 0.5 }); } });
  at(-260, () => fx.shrapnel(0, 0, -120, 10, { speed: 260 }));
  at(-500, () => fx.shrapnel(160, 0, -100, 14, { speed: 200, trail: 3, color: [0.5, 0.08, 0.06] }));
  each.push(() => {
    fx.arcs(-120, 0, 110, 30);
    fx.fireTrail(-120, 0, 110, { scale: 0.8 });

  });
}
// boss death as the game stages it: a chain of 0.6-1.1 blasts every 150 ms over the hull for 1.7 s, then the 2.6 finale
// with the sim's own shockwave ring. &t=1760 = 60 ms into the finale, 1850, 2000, 2400, 3200 = later ages.
function sBossDeath() {
  const bx = +Q.get('bx') || 120, bz = 0, bw = 300, bh = 190;
  const hullM = ship(bx, bz, 0, 4.2);
  for (let k = 0; k < 12; k++) at(150 * k, () => {
    const ex = bx + (Math.random() - 0.5) * bw * 0.7, ez = bz + (Math.random() - 0.5) * bh * 0.55;
    fx.explosion(ex, 0, ez, 0.6 + Math.random() * 0.5);
    for (let i = 0; i < 4; i++) fx.sparks(ex, 0, ez, 2, Math.random() - 0.5, Math.random() - 0.5, { speed: 300, spread: 0.5 });
  });
  at(1700, () => {
    hullM.visible = false;
    fx.explosion(bx, 0, bz, 2.6);
    fx.shockwave(bx, -2, bz, 380, { color: [0.55, 0.33, 0.1], life: 700 });
    fx.shrapnel(bx, 0, bz, 24, { color: [0.5, 0.08, 0.06], size: 26, speed: 240, trail: 2 });
  });
  each.push((T) => {
    if (T < 1700) {
      if (Math.random() < 0.5) fx.fireTrail(bx + (Math.random() - 0.5) * bw * 0.6, 0, bz + (Math.random() - 0.5) * bh * 0.5);
      fx.arcs(bx, 0, bz, bw * 0.42, { rate: 16 });
    }
    for (let i = 0; i < 10; i++) fx.bolt(bx - 80 - ((i * 90 + T * 0.4) % 900), 0, -120 + i * 26, -1, 0, i % 4 ? B.enemy : B.heavy);
  });
}
// boss volleys as seen from the chase camera: a wall, a ring and a spiral of enemy bolts far away and close
function sVolley() {
  ship(PLAYER.x, PLAYER.z, 2); ship(520, 0, 0, 3);
  const E = { kind: 'enemy', scale: 1.3 }, Hv = { kind: 'enemyHeavy', scale: 1.3 };
  each.push((T) => {
    const k = T * 0.3;
    for (let j = 0; j < 3; j++) for (let i = 0; i < 13; i++) { const x = 480 - ((k + j * 330) % 1000); fx.bolt(x, 0, (i - 6) * 48, -1, 0, E); }
    for (let i = 0; i < 20; i++) { const a = (i / 20) * Math.PI * 2, d = 60 + (k * 0.8 % 520); fx.bolt(520 + Math.cos(a) * d, 0, Math.sin(a) * d, Math.cos(a), Math.sin(a), Hv); }
    for (let i = 0; i < 40; i++) { const a = i * 0.5 + T * 0.001, d = 40 + i * 14; fx.bolt(520 + Math.cos(a) * d, 0, Math.sin(a) * d, Math.cos(a), Math.sin(a), i & 1 ? E : Hv); }
    fx.exhaust(PLAYER.x - 34, 0, PLAYER.z - 7, -1, 0, 9, { color: 'player', intensity: 0.7 });
    fx.exhaust(PLAYER.x - 34, 0, PLAYER.z + 7, -1, 0, 9, { color: 'player', intensity: 0.7 });
  });
}
({ bossdeath: sBossDeath, volley: sVolley, impacts: sImpacts, explosions: sExplosions, bolts: sBolts, beams: sBeams, engines: sEngines, lights: sLights, misc: sMisc, all: sAll }[SCENE] || sAll)();
events.sort((a, b) => a[0] - b[0]);

let frame = 0, ev = 0;
function step() {
  frame++;
  const T = frame * DT;
  fx.update(DT, cam, gl.domElement.height);
  while (ev < events.length && events[ev][0] <= T) events[ev++][1]();
  for (const f of each) f(T);
  fx.commit();
}
const info = document.getElementById('info');
function draw() {
  composer.render();
  const s = fx.stats();
  info.textContent = `${SCENE} cam=${CAM} t=${Math.round(frame * DT)}ms | draws ${s.drawCalls} fire ${s.fire} smoke ${s.smoke} sparks ${s.sparks} arcs ${s.arcs} rings ${s.rings} shr ${s.shrapnel} bolts ${s.bolts} beams ${s.beams} glows ${s.glows} | lights real ${s.lights}/${s.lightCap} timed ${s.lightsTimed} now ${s.lightsNow} list ${s.lightCount} | gl calls ${gl.info.render.calls}`;
  if (Q.get('info') === '0') info.style.display = 'none';
}
if (Q.get('live') === '1') {
  const loop = () => { step(); draw(); requestAnimationFrame(loop); };
  loop();
} else {
  const N = Math.max(1, Math.round(TEND / DT));
  for (let i = 0; i < N; i++) step();
  draw(); draw();
  document.title = 'done';
}
</script>
